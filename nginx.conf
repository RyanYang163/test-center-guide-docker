# ============================================================
# Test Center Guide —— nginx 配置
# 本文件整体替换镜像内的 /etc/nginx/nginx.conf（不 include conf.d）
#
# 非 root 适配要点：
#   - pid 落到 /tmp（非 root 写不了 /var/run）
#   - 各类临时目录全部落到 /tmp（只有 /tmp 是稳定可写的）
#   - error_log 走 stderr：容器日志里能直接看到启动与运行错误，便于排查
# ============================================================
worker_processes  auto;
error_log  /dev/stderr  warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    log_format  main  '$remote_addr - [$time_local] "$request" $status '
                      '$body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen       8080;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # 安全响应头。
        # 注意：这里【故意不设】X-Frame-Options / CSP frame-ancestors ——
        # 本应用按 config.ini 的 open_path 以浏览器新标签页外开，
        # 且内容为公开的静态说明页，不设限制可以避免「平台上无法预览」这类问题。
        # （同类项目踩过坑：上游设了 X-Frame-Options: DENY，导致无法内嵌。）
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # 站点脚本/样式全部是本站自有文件，无外链、无内联脚本
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'self'" always;

        location / {
            try_files $uri $uri/ =404;
        }

        # 容器健康检查端点（不记访问日志，避免健康检查刷满日志）
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # 目录列表一律关闭
        autoindex off;
    }
}
