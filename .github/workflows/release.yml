name: Build and Release

# 这个工作流做完整条链路：构建镜像 → Trivy 扫描 → 推 Docker Hub → 出 TOS 包 → 发 Release
# 之所以放在 CI 而不是本地：镜像必须推到一个能访问 hub.docker.com 的环境，
# 而开发者本机通常两样都没有（无 Docker / 无外网）。

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Docker Hub 命名空间与镜像名（tag 由 config.ini 的 version 决定）
  IMAGE_NAME: "test-center-guide"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 解析并校验版本号
        id: meta
        run: |
          set -euo pipefail
          APPID=$(python3 -c "import json;print(json.load(open('config.ini'))['id'])")
          VER=$(python3 -c "import json;print(json.load(open('config.ini'))['version'])")
          PLAT=$(python3 -c "import json;print(json.load(open('config.ini'))['platform'])")

          echo "appid=$APPID" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            # 指引 10.2：tag 与 config.ini 的 version 必须完全一致（前缀 v 可选）
            if [ "${TAG#v}" != "$VER" ]; then
              echo "::error::tag(${TAG}) 与 config.ini 的 version(${VER}) 不一致，平台会拒绝"
              exit 1
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$VER" >> "$GITHUB_OUTPUT"
          fi

          # 平台每份包只报一个架构；镜像则构造成多架构，两个架构共用同一个 tag
          case "$PLAT" in
            x86_64)  echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::config.ini platform 只能是 x86_64 或 aarch64"; exit 1 ;;
          esac

      - name: 守卫 —— 已存在的 Release 一律拒绝覆盖
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          # 覆盖会改变资产哈希 → 平台按 .sha256 比对时 checksum mismatch
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在。禁止覆盖 —— 请改用新的版本号。"
            exit 1
          fi
          echo "Release $TAG 尚不存在，可以继续。"

      - name: 检查 Docker Hub 凭据是否已配置
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::请先在仓库 Settings → Secrets and variables → Actions 添加两个 secret："
            echo "::error::  DOCKERHUB_USERNAME = Docker Hub 用户名"
            echo "::error::  DOCKERHUB_TOKEN    = Docker Hub Access Token（Read & Write）"
            exit 1
          fi

      - name: 本地构建 amd64 镜像（供扫描用）
        run: |
          set -euo pipefail
          IMG="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          docker build --platform linux/amd64 -t "$IMG" -f Dockerfile .
          echo "已构建 $IMG"

      - name: 镜像漏洞扫描（审核项 T1）
        run: |
          set -euo pipefail
          IMG="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version

          count() { python3 -c "
          import json,sys
          try: d=json.load(open(sys.argv[1]))
          except Exception: print(0); raise SystemExit
          print(sum(len(r.get('Vulnerabilities') or []) for r in d.get('Results',[])))
          " "$1"; }

          trivy image --severity HIGH,CRITICAL --no-progress --format json -o r.json "$IMG" || true
          trivy image --severity HIGH,CRITICAL --no-progress --format table -o r.txt "$IMG" || true
          [ -f r.txt ] || echo "（trivy 未产出报告）" > r.txt
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --no-progress --format json -o f.json "$IMG" || true

          TOTAL=$(count r.json)
          FIXABLE=$(count f.json)
          {
            echo "镜像：$IMG"
            echo "HIGH/CRITICAL 总数        : $TOTAL"
            echo "其中「存在官方修复」的    : $FIXABLE"
            echo "其中「上游尚无修复」的    : $((TOTAL - FIXABLE))"
            echo ""
            echo "门禁口径：仅要求「存在官方修复」的 HIGH/CRITICAL 为 0。"
            echo "「上游尚无修复」的漏洞任何镜像都无法消除，不作为拒绝依据。"
            echo ""
            cat r.txt
          } > trivy-report.txt

          echo "HIGH/CRITICAL 总数=$TOTAL  可修复=$FIXABLE"
          if [ "$FIXABLE" != "0" ]; then
            echo "::error::存在 $FIXABLE 个「有官方修复版本」的 HIGH/CRITICAL 漏洞，需换基础镜像版本。"
            grep -E "^[a-z0-9.-]+ +[A-Z0-9-]+ +v?[0-9]" r.txt | head -20 || true

            # 顺手把诊断信息回传（本机连不上 Docker Hub，只有 CI 能查）：
            #   a) 「可修复」漏洞的明细（哪个包、哪个 CVE、装了什么版本、修在什么版本）
            #   b) 候选基础镜像 tag 的最近构建时间 —— 镜像老 = 补丁没跟上，换 tag 才有用
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --no-progress --format table -o fix.txt "$IMG" || true
            DETAIL=$(grep -E 'CVE-' fix.txt | head -10 | tr -s ' ' | tr '\n' '|')
            echo "::notice::可修复漏洞明细: ${DETAIL}"

            for T in 1.31.6-alpine 1.30.5-alpine alpine stable-alpine; do
              META=$(curl -s --max-time 20 "https://hub.docker.com/v2/repositories/library/nginx/tags/${T}" | python3 -c "import json,sys;d=json.load(sys.stdin);print(str(d.get('last_updated'))[:19], round((d.get('full_size') or 0)/1048576, 1), 'MB')" 2>/dev/null || echo "取不到")
              echo "::notice::tag ${T} 最近构建: ${META}"
            done

            # 候选版本清单（最后打，方便肉眼扫）
            TOKEN=$(curl -s --max-time 25 "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/nginx:pull" \
                    | python3 -c "import json,sys;print(json.load(sys.stdin).get('token',''))" 2>/dev/null || true)
            if [ -n "$TOKEN" ]; then
              TAGS=$(curl -s --max-time 25 -H "Authorization: Bearer $TOKEN" \
                     "https://registry-1.docker.io/v2/library/nginx/tags/list" \
                     | python3 -c "import json,sys;d=json.load(sys.stdin);print('\n'.join(d.get('tags') or []))" \
                     | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-alpine(-slim)?$' | sort -V | tail -14 | tr '\n' ' ')
              echo "::notice::线上较新的 nginx alpine 标签（挑一个换 Dockerfile 的 FROM）: ${TAGS}"
            else
              echo "::warning::取不到 nginx 标签列表（registry 鉴权失败）"
            fi
            exit 1
          fi

      - name: 设置 QEMU 与 buildx
        uses: docker/setup-qemu-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: 校验镜像匿名可拉（TOS 设备装机就是匿名拉）
        run: |
          set -euo pipefail
          NS="${{ secrets.DOCKERHUB_USERNAME }}"
          REPO="${{ env.IMAGE_NAME }}"
          TAG="${{ steps.meta.outputs.version }}"
          ACCEPT="application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"

          TOKEN=$(curl -s --max-time 25 "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${NS}/${REPO}:pull" \
                  | python3 -c "import json,sys;print(json.load(sys.stdin).get('token',''))")
          CODE=$(curl -s -o /tmp/manifest.json -m 25 -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" -H "Accept: ${ACCEPT}" \
                 "https://registry-1.docker.io/v2/${NS}/${REPO}/manifests/${TAG}")
          echo "匿名拉取 manifest -> HTTP ${CODE}"
          if [ "$CODE" != "200" ]; then
            echo "::error::镜像 ${NS}/${REPO}:${TAG} 匿名拉不到（HTTP ${CODE}）。若该仓库是私有的，请到 hub.docker.com 把仓库改成 Public —— TOS 设备装机时是匿名拉取，私有仓库装不上。"
            exit 1
          fi
          PLATS=$(python3 -c "
          import json
          d=json.load(open('/tmp/manifest.json'))
          ms=d.get('manifests') or []
          if ms:
              print(' '.join(sorted({(m.get('platform') or {}).get('os','?')+'/'+(m.get('platform') or {}).get('architecture','?') for m in ms})))
          else:
              print('单架构（无 manifest list）')
          ")
          echo "::notice::镜像已推送且匿名可拉 ✓  ${NS}/${REPO}:${TAG}  架构: ${PLATS}"

      - name: 构建 TOS 应用包
        run: |
          set -euo pipefail
          python3 scripts/build-package.py --skip-verify

      - name: 检查构建产物
        id: asset
        run: |
          set -euo pipefail
          APPID="${{ steps.meta.outputs.appid }}"
          TGZ="dist/${APPID}.tar.gz"
          [ -f "$TGZ" ] || { echo "::error::未找到 $TGZ"; exit 1; }
          [ -f "${TGZ}.sha256" ] || { echo "::error::缺少 ${TGZ}.sha256 伴随文件"; exit 1; }
          # 指引 6.2：归档根层恰好 4 个文件
          N=$(tar -tzf "$TGZ" | grep -c '[^/]$')
          if [ "$N" -ne 4 ]; then
            echo "::error::归档根层文件数为 ${N}，必须恰好为 4"
            exit 1
          fi
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 注意：说明文字必须写成【单行变量】。
          # 之前把 --notes "…" 写成跨多行且续行顶格，直接撑断了 run: | 的 YAML 块 ——
          # 后果是工作流解析失败、一个 job 都不创建（2026-09-24 实际踩到）。
          NOTES="TOS 7 Docker 应用包（test-center-guide-docker）。需先在 TOS 应用中心安装并启用 DockerEngine；镜像托管在 Docker Hub 公共仓库（多架构）；附 trivy-report.txt —— 镜像层漏洞扫描报告，可修复的 HIGH/CRITICAL = 0。"
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.asset.outputs.tgz }}" \
            "${{ steps.asset.outputs.tgz }}.sha256" \
            trivy-report.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.meta.outputs.appid }} ${{ steps.meta.outputs.version }}" \
            --notes "$NOTES"
